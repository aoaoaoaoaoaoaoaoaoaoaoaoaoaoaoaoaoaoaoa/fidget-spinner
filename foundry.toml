schema = 1

[product]
name = "Fidget Spinner"
package = "fidget-spinner"
binary = "fidget-spinner"
profile = "portable-cli"

[coordinates]
release-tested = [
  "linux-x86_64",
]

[delivery]
linux = "cargo"

[[exclusions]]
coordinate = "macos-aarch64"
reason = "Version 3 ships a Linux installer and a local Git engine dependency; macOS qualification is deferred."

[[exclusions]]
coordinate = "macos-x86_64"
reason = "Version 3 ships a Linux installer and a local Git engine dependency; macOS qualification is deferred."

[[exclusions]]
coordinate = "windows-x86_64"
reason = "Version 3 ships a Linux installer and a local Git engine dependency; Windows qualification is deferred."

[[proofs]]
name = "source"
laws = ["source"]
run = ["./check.py", "check"]
timeout-minutes = 60

[[proofs]]
name = "security"
laws = ["security"]
run = ["scripts/audit"]
timeout-minutes = 15

[[proofs]]
name = "source-package"
laws = ["source-package"]
run = ["scripts/package"]
timeout-minutes = 45

[[proofs]]
name = "runtime"
laws = ["host"]
run = ["bash", "scripts/prove-runtime"]
coordinates = [
  "linux-x86_64",
]
timeout-minutes = 90

[[proofs]]
name = "lifecycle"
laws = ["lifecycle"]
run = ["bash", "scripts/install-e2e.sh"]
coordinates = ["linux-x86_64"]
timeout-minutes = 90
