[workspace]
members = ["crates/fidget-spinner-core", "crates/fidget-spinner"]
resolver = "3"

[workspace.package]
categories = ["development-tools", "command-line-utilities"]
description = "Local inquiry ledger, MCP server, and navigator for trials, integration sets, and baselines."
edition = "2024"
keywords = ["mcp", "inquiry", "frontier", "trials", "ledger"]
license = "MIT"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/fidget-spinner"
rust-version = "1.98.1"
version = "4.2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
libmcp = { git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/libmcp.git", rev = "7555b42edbbe0d30c007302115a88ea5a5fb639d" }
libmcp-testkit = { git = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/libmcp.git", rev = "7555b42edbbe0d30c007302115a88ea5a5fb639d", package = "libmcp-testkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
trebuchet = { git = "file:///home/main/programming/projects/mcps/trebuchet", rev = "9fca64e", features = ["ledger", "inspect", "board"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
missing_docs = "allow"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
# House policy: a discard is a defect only where `#[must_use]` declares an
# obligation, which `warnings` enforces through `unused_must_use`.
unused_results = "allow"

# House policy: intentional glob vocabularies save tokens; actual ambiguity
# remains a name-resolution error.
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

# House policy: Unicode identifier appearance is not a human-legibility gate.
confusable_idents = "allow"
mixed_script_confusables = "allow"
uncommon_codepoints = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# House policy: `#[must_use]` declares an obligation; blanket annotation
# erases the signal.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -3 }

# House policy: line and parameter counts are not complexity measures.
too_many_arguments = "allow"
too_many_lines = "allow"

# House policy: lexical appearance is not structural correctness.
disallowed_names = "allow"
enum_variant_names = "allow"
similar_names = "allow"
many_single_char_names = "allow"
struct_field_names = "allow"
upper_case_acronyms = "allow"

# House policy: source linting cannot adjudicate transitive convergence.
multiple_crate_versions = "allow"

# Internal tooling does not owe boilerplate API documentation.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

# House policy: direct and enum-variant glob imports are proper local notation.
enum_glob_use = "allow"
wildcard_imports = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--locked",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--locked", "--workspace", "--all-features", "--no-deps"]
canonicalize_commands = [
  ["cargo", "fmt", "--all"],
  [
    "cargo",
    "clippy",
    "--locked",
    "--fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
  ],
]
install_command = ["./scripts/install-local.sh"]
runtime_command = ["bash", "scripts/prove-runtime"]
