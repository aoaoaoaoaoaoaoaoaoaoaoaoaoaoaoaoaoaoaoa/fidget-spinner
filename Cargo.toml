[workspace]
members = [
  "crates/fidget-spinner-core",
  "crates/fidget-spinner-store-sqlite",
  "crates/fidget-spinner-cli",
  "crates/fidget-spinner-portability",
]
resolver = "3"

[workspace.package]
categories = ["development-tools", "command-line-utilities"]
description = "Local-first frontier ledger, MCP server, and navigator for long-running optimization work."
edition = "2024"
keywords = ["mcp", "optimization", "frontier", "experiments", "ledger"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/fidget-spinner"
rust-version = "1.97"
version = "1.0.6"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
dunce = "1"
maud = { version = "0.27", features = ["axum"] }
num-rational = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
pulldown-cmark = "0.13"
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "limits", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v5", "v7"] }

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
missing_docs = "allow"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"

# House policy: intentional glob vocabularies save tokens; actual ambiguity
# remains a name-resolution error.
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

# House policy: Unicode identifier appearance is not a human-legibility gate.
confusable_idents = "allow"
mixed_script_confusables = "allow"
uncommon_codepoints = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -3 }

# House policy: line and parameter counts are not complexity measures.
too_many_arguments = "allow"
too_many_lines = "allow"

# House policy: lexical appearance is not structural correctness.
disallowed_names = "allow"
enum_variant_names = "allow"
similar_names = "allow"
struct_field_names = "allow"
upper_case_acronyms = "allow"

# House policy: source linting cannot adjudicate transitive convergence.
multiple_crate_versions = "allow"

# Internal tooling does not owe boilerplate API documentation.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

# House policy: direct and enum-variant glob imports are proper local notation.
enum_glob_use = "allow"
wildcard_imports = "allow"

[workspace.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
]
test_command = ["cargo", "test", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--workspace", "--all-features", "--no-deps"]
canonicalize_commands = [
  ["cargo", "fmt", "--all"],
  [
    "cargo",
    "clippy",
    "--fix",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--allow-dirty",
    "--allow-staged",
  ],
]
install_command = ["./scripts/install-local.sh"]
ui_e2e_command = ["node", "scripts/ui-e2e.mjs"]
install_e2e_command = ["bash", "scripts/install-e2e.sh"]

[workspace.metadata.rust-starter.source_files]
max_lines = 2500
include = ["*.rs", "**/*.rs"]
exclude = ["crates/fidget-spinner-store-sqlite/src/lib.rs"]
